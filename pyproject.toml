[project]
name = "steel-defect-detection"
version = "0.1.0"
description = "Severstal Steel Defect Detection using YOLO + EfficientNet ensemble"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "ultralytics>=8.0.0",
    "efficientnet-pytorch>=0.7.0",
    "mlflow>=2.8.0",
    "hydra-core>=1.3.0",
    "dvc[s3]>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "tritonclient[http]>=2.37.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "fire>=0.5.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "albumentations>=1.3.0",
    "numpy<2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "python-multipart>=0.0.6",
    "kaggle>=1.5.0",
    "requests>=2.31.0",
    "alembic>=1.16.5",
    "onnx>=1.12.0",
    "onnxruntime>=1.15.0",
    "onnxslim>=0.1.71",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.3.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "flake8>=6.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.5",
    "radon>=6.0.1",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
extend-exclude = '''
/(
  \.git
  | \.venv
  | mlruns
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["steel_defect_detection"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "mlruns",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["steel_defect_detection"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "data", "mlruns"]
skips = ["B101"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "kaggle>=1.7.4.5",
    "nbconvert>=7.16.6",
]
