# Data configuration
dataset_name: "severstal-steel-defect-detection"

# Kaggle dataset
kaggle_dataset: "c/severstal-steel-defect-detection"

# Paths
raw_data_dir: "data/yolo_dataset"
processed_data_dir: "${paths.data_dir}/processed"
train_images_dir: "severstal-steel-defect-detection/train_images"
test_images_dir: "severstal-steel-defect-detection/test_images"
train_csv: "severstal-steel-defect-detection/train.csv"
classification_dataset_dir: "${paths.data_dir}/classification_dataset"

# Data split
train_val_split: 0.8
random_seed: ${seed}

# Image preprocessing
image_size: [640, 640]  # width, height for YOLO
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

# Data augmentation
augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.0
  rotate_limit: 10
  brightness_limit: 0.2
  contrast_limit: 0.2

# Dataloader
batch_size: 16
num_workers: 4
pin_memory: true
