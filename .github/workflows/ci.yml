name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check . --output-format=github
        continue-on-error: false

      - name: Check code formatting with black
        run: |
          uv run black --check --diff .
        continue-on-error: false

      - name: Check import sorting with isort
        run: |
          uv run isort --check-only --diff .
        continue-on-error: false

      - name: Type check with mypy
        run: |
          uv run mypy steel_defect_detection/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short
        continue-on-error: true

  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Security check with bandit
        run: |
          uv run bandit -r steel_defect_detection/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Generate coverage report
        run: |
          uv run pytest tests/ --cov=steel_defect_detection --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Code complexity check with radon
        run: |
          uv run radon cc steel_defect_detection/ -a -nb
        continue-on-error: true
